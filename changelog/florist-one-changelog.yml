description: >-
  SCOPE WARNING, READ BEFORE USING. Florist One publishes NO changelog for its REST API —
  no dated release notes, no version history, no "what's new" page anywhere on
  https://www.floristone.com/api/. What it does publish is a dated changelog for its
  first-party WordPress plugin, "Flower Delivery by Florist One", on wordpress.org. That
  changelog is recorded here because it is the only dated release history Florist One
  publishes and it occasionally reveals API-side changes, but it documents the plugin, not
  the API. No `ChangeLog` pointer is wired in apis.yml for exactly that reason: crediting
  it would assert API change transparency Florist One does not offer.
