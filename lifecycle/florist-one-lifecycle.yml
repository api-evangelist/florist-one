  docs: https://www.floristone.com/api/
  note: >-
    The base path is https://www.floristone.com/api/rest with no version segment. The API
    Agreement defines "API" as Florist One's specification "as may be updated by Provider
    from time to time", pointing at https://www.floristone.com/api/ as the current version
    — the live docs page is the version.
deprecation:
  policy_url: https://www.floristone.com/api/print_api_legal/
  policy_type: contractual-change-notice
  notice_period_days: 30
  sunset_header: false
  deprecation_header: false
  quote: >-
    "If Provider changes any of the Licensed Materials and/or Ecommerce Services, Company
    shall have thirty (30) days after written notice to conform its practices to reflect
    the change, except for changes required by law, payment processors and/or prudent
    security practices, which may have a shorter period, or if such changes are material,
    to terminate this Agreement." (API Agreement, section 2.2)
  note: >-
    This is a contract clause in the API Agreement, not a versioned deprecation policy on
    a developer page, and it carries no RFC 8594 Sunset or Deprecation header support. It
    is nevertheless a published, binding, dated change-notice commitment, which is what is
    recorded here.
suspension:
  policy_url: https://www.floristone.com/api/print_api_legal/
  note: >-
    Section 5.2.2 — Florist One may suspend or terminate API access for material breach,
    illegal or fraudulent activity, or termination of a subcontractor's services. Either
    party may terminate for material breach uncured 30 days after written notice.
