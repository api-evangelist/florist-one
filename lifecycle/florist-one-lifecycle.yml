description: >-
  Florist One runs the API's lifecycle contractually rather than technically. There is no
  version in the URL, no changelog for the API itself, and no status page — but the API
  Agreement does bind Florist One to a written change-notice period, which is a real and
  unusually explicit commitment for a provider of this size.
