specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Florist One
providerId: florist-one
generated: '2026-09-10'
method: searched
source: >-
  https://www.floristone.com/api/flowers-api-faq/,
  https://www.floristone.com/api/,
  https://www.floristone.com/api/print_api_legal/,
  https://wordpress.org/plugins/flower-delivery-by-florist-one/
created: '2026-05-04'
modified: '2026-09-10'
supersedes: >-
  REPLACED A SCAFFOLD. The prior version of this file (method: generated, dated 2026-05-04)
  invented a three-tier Free/Professional/Enterprise structure with a 1,000 request monthly
  quota, a 100,000 request professional quota and TBD overage pricing. None of that exists.
  Florist One publishes exactly one commercial arrangement and it is recorded below.
plan_count: 1
tags:
  - Delivery
  - Ecommerce
  - Florists
  - Flowers
  - Gifts
description: >-
  Florist One charges nothing for API access and publishes no tiers, no quotas, and no
  overage pricing. The commercial model runs the other direction: the integrator is paid.
  Access to the API is bundled with the Florist One Affiliate Program, and the integrator
  receives a 20% commission on every flower sale made through their application. Florist
  One takes the payment, fulfills through its florist network, and handles customer service.
pricing_model: free-api-with-revenue-share
pricing_page: null
pricing_page_note: >-
  There is no pricing page. The cost question is answered in the FAQ — "Our API is free. We
  pay you 20% of the sale when you sell flowers." — and the commercial terms live in the
  API Agreement and the Affiliate Agreement rather than on a plans page.
plans:
  - id: florist-one-api-free
    name: Florist One API
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    description: >-
      The only published plan. Free API access issued as an API Key plus password after
      signup at https://www.floristone.com/api/api-signup/, bundled with membership of the
      Florist One Affiliate Program.
    source: https://www.floristone.com/api/flowers-api-faq/
    quota: null
    quota_note: No request quota, call volume, or fair-use ceiling is published.
    overage: null
    limits_note: >-
      No rate limit is published. See rate-limits/florist-one-rate-limits.yml.
    entries:
      - label: API Access
        description: Unrestricted-as-published access to the Florist One REST API. No fee.
        name: api_access
        type: quota
        metric: requests
        limit: null
        timeFrame: null
        geo: 'Delivery to United States and Canada only'
        domains:
          - https://www.floristone.com/api/rest
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Affiliate Commission
        description: >-
          Florist One pays the integrator 20% of each flower sale placed through their
          application. This is revenue to the integrator, not a charge.
        name: affiliate_commission
        type: revenue_share
        metric: percent_of_sale
        limit: 20
        timeFrame: per_transaction
        geo: 'United States and Canada'
        domains:
          - https://www.floristone.com/api/rest
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Florist One API
      - name: Public Documentation
      - name: Gated Technical Documentation (API key required)
      - name: PHP and ColdFusion Code Samples (released after signup)
      - name: Affiliate Program Membership
      - name: Florist One Order Fulfillment and Customer Service
commercial_terms:
  commission_rate: '20%'
  commission_source: https://www.floristone.com/api/flowers-api-faq/
  payout_schedule: >-
    Paid by check on the first of the month for the prior month's sales, with a $150 sales
    threshold below which earnings carry forward. Source — the plugin FAQ at
    https://wordpress.org/plugins/flower-delivery-by-florist-one/.
  currencies: [USD, CAD]
  currency_note: >-
    Orders delivered to the US are charged in USD and orders delivered to Canada in CAD.
    An affiliate selling into both countries must maintain two API keys and swap them based
    on the destination of the order — a real operational constraint published in the FAQ.
  sales_tax: >-
    Florist One charges sales tax at the prevailing rate for Flagler County, Florida
    (API Agreement, section 4.2.6).
  fraud_liability: >-
    The integrator is responsible for costs up to the amount of its commissions on any
    order unpaid due to fraud (API Agreement, section 4.2.5).
  enterprise_tier: false
  enterprise_note: No enterprise, partner, or negotiated tier is published.
maintainers:
