description: >-
  Florist One publishes no client library in any language package registry. The one
  first-party, registry-distributed, versioned artifact is a WordPress plugin. The PHP
  and ColdFusion "code samples" the FAQ advertises are a GitHub repository of raw curl
  snippets, not an installable package, and the FAQ says the samples themselves are only
  handed over after API signup.
sdk_finding: >-
  NO first-party language SDK exists. No `SDKs` pointer is wired in apis.yml as a result:
  the WordPress plugin is a turnkey storefront for site owners, not a client library a
  developer codes against, and crediting it as an SDK would assert a developer artifact
  Florist One does not ship. Recorded here as an official package, which it genuinely is.
